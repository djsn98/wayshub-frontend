name: wayshub-frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  init:
    runs-on: ubuntu-22.04 
    environment: development

    steps:
      - name: Checkout SCM
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t djsn98/wayshub-fe:${{ vars.TAG }} .

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Docker Push
        run: docker push djsn98/wayshub-fe:${{ vars.TAG }}

  deploy:
    runs-on: ubuntu-22.04
    environment: development
    needs: init

    steps:
      - name: Execute SSH for deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd deploy/
            docker compose -f docker-compose-fe.yaml down
            docker image rm djsn98/wayshub-fe:${{ vars.TAG }} || true
            docker compose -f docker-compose-fe.yaml up -d
            
      - name: Discord Success Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "content": "✅ GitHub Actions berhasil!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Discord Failure Notification
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "content": "❌ GitHub Actions gagal!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
