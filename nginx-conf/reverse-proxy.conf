

# ==========================================
# 1. KONFIGURASI FRONTEND (Contoh: app.studentdumbways.my.id)
# ==========================================
server {
    listen 443 ssl;
    server_name dennis.studentdumbways.my.id;

    # Path sertifikat SSL Wildcard yang sama untuk semua subdomain
    ssl_certificate /etc/letsencrypt/live/studentdumbways.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studentdumbways.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Arahkan ke nama container Docker frontend Anda dan port internalnya
        proxy_pass http://52.147.124.25:3000; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# 2. KONFIGURASI BACKEND / API (Contoh: api.studentdumbways.my.id)
# ==========================================
server {
    listen 443 ssl;
    server_name be-dennis.studentdumbways.my.id;

    # Path sertifikat SSL Wildcard
    ssl_certificate /etc/letsencrypt/live/studentdumbways.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studentdumbways.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Arahkan ke nama container Docker backend Anda dan port internalnya
        proxy_pass http://52.147.124.25:5000; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# 3. REDIRECT OTOMATIS HTTP KE HTTPS (Opsional tapi Direkomendasikan)
# ==========================================
server {
    listen 80;
    server_name studentdumbways.my.id *.studentdumbways.my.id;
    return 301 https://$host$request_uri;
}
